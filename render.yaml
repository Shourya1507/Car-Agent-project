services:
  - type: web
    name: carcheck-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render injects $PORT automatically — our run_local.py reads it
    healthCheckPath: /health
    disk:
      name: carcheck-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
    autoDeploy: true   # Re-deploy on every push to main
