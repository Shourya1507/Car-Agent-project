version: "3.9"

services:
  carcheck:
    build:
      context: .
      dockerfile: Dockerfile
    image: carcheck-agent:latest
    container_name: carcheck-agent
    ports:
      - "8000:8000"
    volumes:
      # Persist database, keys, evidence, and reports across restarts
      - carcheck_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  carcheck_data:
    driver: local
